sentence=Hardware support for the Tiny RPN Calculator: ATtiny85, SSD1306 128x32 OLED, DS3231M RTC, 16-key analog keyboard.
paragraph=Header-only modules for the display, text with custom fonts, real-time clock, keyboard, power and frame timer. Extras: virtual machines that run the original HP-35 and HP-21 ROMs, SHA-1, HMAC-SHA1 and TOTP. Only for ATtiny85 at 16 MHz (PLL).
