    @media (prefers-color-scheme: dark) {
      .note     { fill: #e6edf3; }
    }
    @keyframes flash { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .barflash { animation: none; }
    }
  </style>
