<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 748 164" width="748" height="164" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Watch screen during the charge: the last bar of the battery indicator flashes</title>
  <style>
    .barflash { animation: flash 1024ms step-end infinite; }
    .note     { font-size: 22px; fill: #1f2328; }
