    <text class="shift" x="775" y="225">÷</text>
    <use href="#key" x="295" y="330"/>
    <text class="main" x="235" y="347">E</text>
    <text class="shift" x="295" y="305">ROT↑</text>
    <use href="#key" x="455" y="330"/>
    <text class="main" x="395" y="347">4</text>
    <text class="shift" x="455" y="305">CONST</text>
    <use href="#key" x="615" y="330"/>
    <text class="main" x="555" y="347">5</text>
