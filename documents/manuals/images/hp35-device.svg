    <use href="#key" x="775" y="330"/>
    <text class="main" x="715" y="347">6</text>
    <text class="shift" x="775" y="305">×</text>
    <use href="#key" x="295" y="410"/>
    <text class="main" x="235" y="427">±</text>
    <text class="shift" x="295" y="385">ROT↓</text>
    <use href="#key" x="455" y="410"/>
    <text class="main" x="395" y="427">1</text>
    <text class="shift" x="455" y="385">RCL</text>
    <use href="#key" x="615" y="410"/>
    <text class="main" x="555" y="427">2</text>
    <text class="shift" x="615" y="385">STO</text>
    <use href="#key" x="775" y="410"/>
    <text class="main" x="715" y="427">3</text>
    <text class="shift" x="775" y="385">−</text>
    <use href="#key" x="295" y="490"/>
