    <text class="shift" x="615" y="465">X↔Y</text>
    <use href="#key" x="775" y="490"/>
    <text class="main" x="715" y="507">↑</text>
    <text class="shift" x="775" y="465">+</text>

  <!-- part numbers -->
  <g>
    <circle class="badge" cx="163" cy="155" r="11"/><text class="badgetx" x="163" y="160">1</text>
    <circle class="badge" cx="195" cy="528" r="11"/><text class="badgetx" x="195" y="533">2</text>
    <circle class="badge" cx="532" cy="22" r="11"/><text class="badgetx" x="532" y="27">3</text>
    <circle class="badge" cx="735" cy="140" r="11"/><text class="badgetx" x="735" y="145">4</text>
    <circle class="badge" cx="460" cy="136" r="11"/><text class="badgetx" x="460" y="141">5</text>
    <circle class="badge" cx="515" cy="122" r="11"/><text class="badgetx" x="515" y="127">6</text>
    <circle class="badge" cx="596" cy="108" r="11"/><text class="badgetx" x="596" y="113">7</text>
  </g>
</svg>
