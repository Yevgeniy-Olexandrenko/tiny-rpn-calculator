<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 875 560" width="875" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tiny RPN Calculator: primary parts</title>
  <style>
    .badge    { fill: #0969da; }
    .badgetx  { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .board    { stroke-width: 2.5; fill: #ffffff; stroke: #57606a; }
    .cap      { fill: #1f2328; }
    .cell     { fill: #eaeef2; stroke: #d18b2c; stroke-width: 10; }
    .chip     { fill: #24292f; }
    .chiptxt  { fill: #ffffff; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .glass    { fill: #24292f; stroke: #57606a; stroke-width: 1.5; }
    .hole     { fill: none; stroke-width: 2; stroke: #57606a; }
    .label    { fill: #1f2328; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .ledge    { fill: #57606a; }
    .line     { fill: none; stroke-width: 1.5; stroke: #1f2328; }
    .main     { font-size: 52px; text-anchor: middle; fill: #1f2328; }
    .overlay  { stroke-width: 2; fill: #ffffff; stroke: #57606a; }
    .panel    { fill: #000000; }
    .pin      { fill: #8c959f; }
    .pixel    { fill: #ffffff; }
    .ribbon   { fill: #d18b2c; }
    .shift    { font-size: 26px; fill: #1f2328; }
    .slot     { fill: none; stroke-width: 1.5; stroke: #57606a; }
    .subtitle { font-size: 27px; text-anchor: middle; fill: #57606a; }
    .tab      { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .title    { font-size: 46px; font-weight: 700; text-anchor: middle; fill: #1f2328; }
    .usb      { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .usbleg   { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .badge    { fill: #2f81f7; }
      .board    { fill: #0d1117; stroke: #8b949e; }
      .cap      { fill: #e6edf3; }
      .chip     { fill: #30363d; }
      .hole     { stroke: #8b949e; }
      .line     { stroke: #e6edf3; }
      .main     { fill: #e6edf3; }
      .overlay  { fill: #0d1117; stroke: #8b949e; }
      .pin      { fill: #6e7681; }
      .shift    { fill: #e6edf3; }
      .slot     { stroke: #8b949e; }
      .subtitle { fill: #8b949e; }
      .title    { fill: #e6edf3; }
    }
  </style>
  <defs>
    <!-- slot of the keyboard board and the button of the 3 x 6 mm tact switch -->
    <g id="key">
      <path class="slot" d="M-25,-20 H25 L35,-10 V10 L25,20 H-25 L-35,10 V-10 Z"/>
      <rect class="cap" x="-19" y="-9" width="38" height="18" rx="3"/>
    </g>
    <!-- one side of a SOIC-8 -->
    <g id="soic-pins">
      <rect class="pin" x="-21" y="-4" width="4" height="8"/>
      <rect class="pin" x="-8.5" y="-4" width="4" height="8"/>
      <rect class="pin" x="4.5" y="-4" width="4" height="8"/>
      <rect class="pin" x="17" y="-4" width="4" height="8"/>
    </g>
  </defs>

  <!-- main board: 85.5 x 54 mm, 3 mm corners -->
  <rect class="board" x="0" y="0" width="855" height="540" rx="30"/>
  <circle class="hole" cx="825" cy="30" r="12.7"/>

  <!-- (1) display: glass, OLED panel with the watch screen, flexible cable -->
  <rect class="ribbon" x="310" y="58" width="56" height="78" rx="3"/>
  <rect class="glass" x="12" y="24" width="303" height="115" rx="3"/>
  <rect class="panel" x="16" y="28" width="246" height="94"/>
  <rect class="ledge" x="16" y="122" width="246" height="13"/>
  <path class="pixel" transform="translate(26 47) scale(1.75)" d="M6 2v13h1v-13zM6 16v13h1v-13zM8 2v13h1v-13zM9 15v1h5v-1zM14 2v13h1v-13zM14 16v13h1v-13zM18 8v3h3v-3zM18 20v3h3v-3zM25 1v1h5v-1zM25 15v1h5v-1zM25 29v1h5v-1zM30 2v13h1v-13zM30 16v13h1v-13zM32 2v13h1v-13zM32 16v13h1v-13zM33 1v1h5v-1zM33 29v1h5v-1zM38 2v13h1v-13zM38 16v13h1v-13zM42 8v3h3v-3zM42 20v3h3v-3zM48 2v13h1v-13zM48 16v13h1v-13zM49 1v1h5v-1zM49 29v1h5v-1zM54 2v13h1v-13zM54 16v13h1v-13zM56 2v13h1v-13zM56 16v13h1v-13zM57 1v1h5v-1zM57 29v1h5v-1zM62 2v13h1v-13zM62 16v13h1v-13zM72 1v6h1v-6zM72 11v1h10v-1zM72 17v6h2v-6zM73 1v1h3v-1zM73 6v1h3v-1zM74 19v1h6v-1zM76 1v6h1v-6zM78 1v6h1v-6zM79 1v1h4v-1zM79 6v1h4v-1zM80 17v6h2v-6zM83 11v1h10v-1zM83 17v6h2v-6zM84 1v1h2v-1zM85 17v1h6v-1zM85 20v1h6v-1zM86 1v6h1v-6zM87 1v1h2v-1zM91 17v4h2v-4zM94 11v1h10v-1zM94 19v1h10v-1zM98 1v1h1v-1zM99 1v6h1v-6zM103 1v2h1v-2zM104 1v1h3v-1zM105 11v1h10v-1zM105 17v1h8v-1zM105 22v1h8v-1zM107 1v6h1v-6zM107 19v1h6v-1zM109 6v1h1v-1zM110 5v1h1v-1zM111 4v1h1v-1zM112 3v1h1v-1zM113 2v1h1v-1zM113 17v6h2v-6zM115 1v1h4v-1zM115 4v3h1v-3zM116 4v1h3v-1zM116 6v1h4v-1zM116 17v3h2v-3zM116 22v1h8v-1zM118 17v1h8v-1zM118 19v1h6v-1zM119 1v4h1v-4zM121 1v6h1v-6zM122 1v1h4v-1zM122 3v1h3v-1zM122 6v1h3v-1zM124 19v4h2v-4zM125 3v4h1v-4z"/>

  <!-- (5) MCU, ATtiny85 in SOIC-8 5.3 mm -->
  <use href="#soic-pins" x="460" y="40"/>
  <use href="#soic-pins" x="460" y="105"/>
  <rect class="chip" x="433.5" y="46" width="53" height="53" rx="3"/>
  <text class="chiptxt" x="460" y="77">MCU</text>

  <!-- (6) RTC, DS3231M in SOIC-8 3.9 mm -->
  <use href="#soic-pins" x="515" y="40"/>
  <use href="#soic-pins" x="515" y="90"/>
  <rect class="chip" x="490.5" y="45.5" width="49" height="39" rx="3"/>
  <text class="chiptxt" x="515" y="70">RTC</text>

  <!-- (3) USB-C receptacle, its front flush with the top edge -->
  <rect class="usbleg" x="549" y="42" width="8" height="16" rx="1"/>
  <rect class="usbleg" x="643" y="42" width="8" height="16" rx="1"/>
  <rect class="usb" x="556" y="0" width="88" height="72" rx="3"/>
  <text class="label" x="600" y="60">USB-C</text>

  <!-- (7) charger in SOT-23-5, right edge aligned with USB-C -->
  <rect class="pin" x="617" y="93" width="4" height="7"/>
  <rect class="pin" x="637" y="93" width="4" height="7"/>
  <rect class="pin" x="617" y="115" width="4" height="7"/>
  <rect class="pin" x="627" y="115" width="4" height="7"/>
  <rect class="pin" x="637" y="115" width="4" height="7"/>
  <rect class="chip" x="614" y="99" width="30" height="17" rx="2"/>

  <!-- (4) battery: 16 mm coin cell in the cutout of the board -->
  <circle class="cell" cx="735" cy="102.5" r="75"/>
  <rect class="tab" x="700" y="87.5" width="130" height="30" rx="6"/>
  <text class="label" x="735" y="70">BATTERY</text>

  <!-- keyboard board over the lower part: 37 mm high, cut out around the battery -->
  <path class="overlay" d="M0,170 H687.5 A82.55,82.55 0 0 0 782.5,170 H855 V510 a30,30 0 0 1 -30,30 H30 a30,30 0 0 1 -30,-30 Z"/>
  <text class="title" transform="rotate(-90 141 358)" x="141" y="358" textLength="330" lengthAdjust="spacingAndGlyphs">Business Card</text>
  <text class="subtitle" transform="rotate(-90 176 358)" x="176" y="358" textLength="330" lengthAdjust="spacingAndGlyphs">RPN Calculator with Watch</text>

  <!-- (2) keyboard -->
  <path class="line" d="M215,200 H840 V520 H215 Z M375,200 V520 M535,200 V520 M695,200 V520 M215,280 H840 M215,360 H840 M215,440 H840"/>
  <use href="#key" x="295" y="250"/><text class="main" x="235" y="258">F</text><text class="shift" x="260" y="225">MATH</text>
  <use href="#key" x="455" y="250"/><text class="main" x="395" y="258">7</text><text class="shift" x="420" y="225">TRIG</text>
  <use href="#key" x="615" y="250"/><text class="main" x="555" y="258">8</text><text class="shift" x="580" y="225">PROG</text>
  <use href="#key" x="775" y="250"/><text class="main" x="715" y="258">9</text><text class="shift" x="740" y="225">÷</text>
  <use href="#key" x="295" y="330"/><text class="main" x="235" y="338">E</text><text class="shift" x="260" y="305">ROT↑</text>
  <use href="#key" x="455" y="330"/><text class="main" x="395" y="338">4</text><text class="shift" x="420" y="305">CONST</text>
  <use href="#key" x="615" y="330"/><text class="main" x="555" y="338">5</text><text class="shift" x="580" y="305">MEM+</text>
  <use href="#key" x="775" y="330"/><text class="main" x="715" y="338">6</text><text class="shift" x="740" y="305">×</text>
  <use href="#key" x="295" y="410"/><text class="main" x="235" y="418">±</text><text class="shift" x="260" y="385">ROT↓</text>
  <use href="#key" x="455" y="410"/><text class="main" x="395" y="418">1</text><text class="shift" x="420" y="385">RCL</text>
  <use href="#key" x="615" y="410"/><text class="main" x="555" y="418">2</text><text class="shift" x="580" y="385">STO</text>
  <use href="#key" x="775" y="410"/><text class="main" x="715" y="418">3</text><text class="shift" x="740" y="385">−</text>
  <use href="#key" x="295" y="490"/><text class="main" x="235" y="498">C</text><text class="shift" x="260" y="465">AC</text>
  <use href="#key" x="455" y="490"/><text class="main" x="395" y="498">0</text><text class="shift" x="420" y="465">LAST</text>
  <use href="#key" x="615" y="490"/><text class="main" x="555" y="498">.</text><text class="shift" x="580" y="465">X↔Y</text>
  <use href="#key" x="775" y="490"/><text class="main" x="715" y="498">↑</text><text class="shift" x="740" y="465">+</text>

  <!-- part numbers -->
  <circle class="badge" cx="288" cy="81" r="11"/><text class="badgetx" x="288" y="86">1</text>
  <circle class="badge" cx="196" cy="186" r="11"/><text class="badgetx" x="196" y="191">2</text>
  <circle class="badge" cx="600" cy="28" r="11"/><text class="badgetx" x="600" y="33">3</text>
  <circle class="badge" cx="735" cy="140" r="11"/><text class="badgetx" x="735" y="145">4</text>
  <circle class="badge" cx="460" cy="136" r="11"/><text class="badgetx" x="460" y="141">5</text>
  <circle class="badge" cx="515" cy="122" r="11"/><text class="badgetx" x="515" y="127">6</text>
  <circle class="badge" cx="596" cy="108" r="11"/><text class="badgetx" x="596" y="113">7</text>
</svg>
