<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 875 560" width="875" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tiny RPN Calculator: primary parts</title>
  <style>
    .board   { fill: #ffffff; stroke: #57606a; stroke-width: 2.5; }
    .overlay { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; }
    .line    { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .chip    { fill: #24292f; }
    .pin     { fill: #8c959f; }
    .chiptxt { fill: #ffffff; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .usb     { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .port    { fill: #57606a; }
    .cell    { fill: #eaeef2; stroke: #57606a; stroke-width: 1.5; }
    .tab     { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .label   { fill: #1f2328; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .main    { fill: #1f2328; font-size: 52px; text-anchor: middle; }
    .shift   { fill: #57606a; font-size: 26px; text-anchor: middle; }
    .title   { fill: #1f2328; font-size: 46px; font-weight: 700; text-anchor: middle; }
    .subtitle{ fill: #57606a; font-size: 27px; text-anchor: middle; }
    .slot    { fill: #8c959f; }
    .switch  { fill: #d0d7de; stroke: #8c959f; stroke-width: 1; }
    .cap     { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .badge   { fill: #0969da; }
    .badgetx { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .glass   { fill: #24292f; stroke: #57606a; stroke-width: 1.5; }
    .panel   { fill: #000000; }
    .ledge   { fill: #57606a; }
    .pixel   { fill: #ffffff; }
    .ribbon  { fill: #d18b2c; }
    .hole    { fill: #ffffff; stroke: #57606a; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .board   { fill: #0d1117; stroke: #8b949e; }
      .overlay { fill: #161b22; stroke: #8b949e; }
      .line    { stroke: #6e7681; }
      .chip    { fill: #30363d; }
      .pin     { fill: #6e7681; }
      .usb, .tab { fill: #30363d; stroke: #8b949e; }
      .port    { fill: #8b949e; }
      .cell    { fill: #21262d; stroke: #8b949e; }
      .label, .main, .title { fill: #e6edf3; }
      .shift, .subtitle { fill: #8b949e; }
      .slot    { fill: #484f58; }
      .switch  { fill: #30363d; stroke: #6e7681; }
      .cap     { fill: #c9d1d9; stroke: #6e7681; }
      .badge   { fill: #2f81f7; }
      .glass   { stroke: #8b949e; }
      .ledge   { fill: #6e7681; }
      .hole    { fill: #0d1117; stroke: #8b949e; }
    }
  </style>
  <defs>
    <!-- key seen through the slot of the keyboard board: 3 x 6 mm tact switch -->
    <g id="key">
      <path class="slot" d="M-25,-20 H25 L35,-10 V10 L25,20 H-25 L-35,10 V-10 Z"/>
      <rect class="switch" x="-30" y="-15" width="60" height="30" rx="3"/>
      <rect class="cap" x="-19" y="-9" width="38" height="18" rx="2"/>
    </g>
    <g id="soic-pins">
      <rect class="pin" x="-21" y="-4" width="4" height="8"/>
      <rect class="pin" x="-8.5" y="-4" width="4" height="8"/>
      <rect class="pin" x="4.5" y="-4" width="4" height="8"/>
      <rect class="pin" x="17" y="-4" width="4" height="8"/>
    </g>
  </defs>

  <!-- main board: 85.5 x 54 mm, 3 mm corners -->
  <rect class="board" x="0" y="0" width="855" height="540" rx="30"/>
  <circle class="hole" cx="825" cy="30" r="12.7"/>

  <!-- (1) display: glass, OLED panel with the watch screen, flexible cable -->
  <rect class="ribbon" x="310" y="58" width="56" height="78" rx="3"/>
  <rect class="glass" x="12" y="24" width="303" height="115" rx="3"/>
  <rect class="panel" x="16" y="28" width="246" height="94"/>
  <rect class="ledge" x="16" y="122" width="246" height="13"/>
  <g transform="translate(26 47) scale(1.75)"><path class="pixel" d="M25,1h5v1h-5zM33,1h5v1h-5zM49,1h5v1h-5zM57,1h5v1h-5zM72,1h5v1h-5zM78,1h5v1h-5zM84,1h5v1h-5zM98,1h2v1h-2zM103,1h5v1h-5zM115,1h5v1h-5zM121,1h5v1h-5zM6,2h1v1h-1zM8,2h1v1h-1zM14,2h1v1h-1zM30,2h1v1h-1zM32,2h1v1h-1zM38,2h1v1h-1zM48,2h1v1h-1zM54,2h1v1h-1zM56,2h1v1h-1zM62,2h1v1h-1zM72,2h1v1h-1zM76,2h1v1h-1zM78,2h1v1h-1zM86,2h1v1h-1zM99,2h1v1h-1zM103,2h1v1h-1zM107,2h1v1h-1zM113,2h1v1h-1zM119,2h1v1h-1zM121,2h1v1h-1zM6,3h1v1h-1zM8,3h1v1h-1zM14,3h1v1h-1zM30,3h1v1h-1zM32,3h1v1h-1zM38,3h1v1h-1zM48,3h1v1h-1zM54,3h1v1h-1zM56,3h1v1h-1zM62,3h1v1h-1zM72,3h1v1h-1zM76,3h1v1h-1zM78,3h1v1h-1zM86,3h1v1h-1zM99,3h1v1h-1zM107,3h1v1h-1zM112,3h1v1h-1zM119,3h1v1h-1zM121,3h5v1h-5zM6,4h1v1h-1zM8,4h1v1h-1zM14,4h1v1h-1zM30,4h1v1h-1zM32,4h1v1h-1zM38,4h1v1h-1zM48,4h1v1h-1zM54,4h1v1h-1zM56,4h1v1h-1zM62,4h1v1h-1zM72,4h1v1h-1zM76,4h1v1h-1zM78,4h1v1h-1zM86,4h1v1h-1zM99,4h1v1h-1zM107,4h1v1h-1zM111,4h1v1h-1zM115,4h5v1h-5zM121,4h1v1h-1zM125,4h1v1h-1zM6,5h1v1h-1zM8,5h1v1h-1zM14,5h1v1h-1zM30,5h1v1h-1zM32,5h1v1h-1zM38,5h1v1h-1zM48,5h1v1h-1zM54,5h1v1h-1zM56,5h1v1h-1zM62,5h1v1h-1zM72,5h1v1h-1zM76,5h1v1h-1zM78,5h1v1h-1zM86,5h1v1h-1zM99,5h1v1h-1zM107,5h1v1h-1zM110,5h1v1h-1zM115,5h1v1h-1zM121,5h1v1h-1zM125,5h1v1h-1zM6,6h1v1h-1zM8,6h1v1h-1zM14,6h1v1h-1zM30,6h1v1h-1zM32,6h1v1h-1zM38,6h1v1h-1zM48,6h1v1h-1zM54,6h1v1h-1zM56,6h1v1h-1zM62,6h1v1h-1zM72,6h5v1h-5zM78,6h5v1h-5zM86,6h1v1h-1zM99,6h1v1h-1zM107,6h1v1h-1zM109,6h1v1h-1zM115,6h5v1h-5zM121,6h5v1h-5zM6,7h1v1h-1zM8,7h1v1h-1zM14,7h1v1h-1zM30,7h1v1h-1zM32,7h1v1h-1zM38,7h1v1h-1zM48,7h1v1h-1zM54,7h1v1h-1zM56,7h1v1h-1zM62,7h1v1h-1zM6,8h1v1h-1zM8,8h1v1h-1zM14,8h1v1h-1zM18,8h3v1h-3zM30,8h1v1h-1zM32,8h1v1h-1zM38,8h1v1h-1zM42,8h3v1h-3zM48,8h1v1h-1zM54,8h1v1h-1zM56,8h1v1h-1zM62,8h1v1h-1zM6,9h1v1h-1zM8,9h1v1h-1zM14,9h1v1h-1zM18,9h3v1h-3zM30,9h1v1h-1zM32,9h1v1h-1zM38,9h1v1h-1zM42,9h3v1h-3zM48,9h1v1h-1zM54,9h1v1h-1zM56,9h1v1h-1zM62,9h1v1h-1zM6,10h1v1h-1zM8,10h1v1h-1zM14,10h1v1h-1zM18,10h3v1h-3zM30,10h1v1h-1zM32,10h