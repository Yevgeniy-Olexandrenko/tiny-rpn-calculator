<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tiny RPN Calculator: primary parts</title>
  <style>
    .board   { fill: #ffffff; stroke: #57606a; stroke-width: 2.5; }
    .overlay { fill: #f6f8fa; stroke: #57606a; stroke-width: 2; }
    .grid    { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .chip    { fill: #24292f; }
    .pin     { fill: #8c959f; }
    .chiptxt { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; }
    .usb     { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .usbslot { fill: #57606a; }
    .bat     { fill: #eaeef2; stroke: #57606a; stroke-width: 1.5; }
    .label   { fill: #1f2328; font-size: 14px; text-anchor: middle; }
    .main    { fill: #1f2328; font-size: 34px; text-anchor: middle; }
    .shift   { fill: #57606a; font-size: 16px; text-anchor: middle; }
    .title   { fill: #1f2328; font-size: 30px; font-weight: 700; text-anchor: middle; }
    .subtitle{ fill: #57606a; font-size: 17px; text-anchor: middle; }
    .btnfrm  { fill: #d0d7de; stroke: #8c959f; stroke-width: 1; }
    .btn     { fill: #ffffff; stroke: #8c959f; stroke-width: 1; }
    .badge   { fill: #0969da; }
    .badgetx { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .glass   { fill: #161b22; stroke: #57606a; stroke-width: 1.5; }
    .screen  { fill: #000000; }
    .lcd     { fill: #79c0ff; font-family: Consolas, Menlo, monospace; }
    .ribbon  { fill: #d18b2c; }
    .hole    { fill: none; stroke: #57606a; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .board   { fill: #0d1117; stroke: #8b949e; }
      .overlay { fill: #161b22; stroke: #8b949e; }
      .grid    { stroke: #6e7681; }
      .chip    { fill: #30363d; }
      .pin     { fill: #6e7681; }
      .usb     { fill: #30363d; stroke: #8b949e; }
      .usbslot { fill: #8b949e; }
      .bat     { fill: #21262d; stroke: #8b949e; }
      .label, .main, .title { fill: #e6edf3; }
      .shift, .subtitle { fill: #8b949e; }
      .btnfrm  { fill: #30363d; stroke: #6e7681; }
      .btn     { fill: #c9d1d9; stroke: #6e7681; }
      .badge   { fill: #2f81f7; }
      .glass   { stroke: #8b949e; }
      .hole    { stroke: #8b949e; }
    }
  </style>

  <g transform="translate(10 12)">
    <!-- board, 85.6 x 54 mm at 10 units per mm -->
    <rect class="board" x="0" y="0" width="856" height="540" rx="32"/>
    <circle class="hole" cx="826" cy="30" r="10"/>

    <!-- keyboard board over the lower part -->
    <path class="overlay" d="M0,178 H856 V508 a32,32 0 0 1 -32,32 H32 a32,32 0 0 1 -32,-32 Z"/>

    <!-- (1) display module with the watch screen -->
    <rect class="glass" x="30" y="28" width="300" height="124" rx="4"/>
    <rect class="ribbon" x="330" y="62" width="14" height="56"/>
    <rect class="screen" x="42" y="42" width="254" height="96"/>
    <text class="lcd" x="50" y="104" font-size="38">14:30:00</text>
    <text class="lcd" x="226" y="70" font-size="12">OCT 17/26</text>
    <text class="lcd" x="226" y="90" font-size="12">====</text>
    <text class="lcd" x="226" y="112" font-size="14" font-weight="700">HP-35</text>

    <!-- (5) MCU and (6) RTC, SOIC-8 -->
    <g id="soic">
      <rect class="pin" x="364" y="70" width="6" height="10"/>
      <rect class="pin" x="378" y="70" width="6" height="10"/>
      <rect class="pin" x="392" y="70" width="6" height="10"/>
      <rect class="pin" x="406" y="70" width="6" height="10"/>
      <rect class="pin" x="364" y="140" width="6" height="10"/>
      <rect class="pin" x="378" y="140" width="6" height="10"/>
      <rect class="pin" x="392" y="140" width="6" height="10"/>
      <rect class="pin" x="406" y="140" width="6" height="10"/>
      <rect class="chip" x="356" y="78" width="64" height="64" rx="3"/>
    </g>
    <text class="chiptxt" x="388" y="115">MCU</text>
    <use href="#soic" x="88"/>
    <text class="chiptxt" x="476" y="115">RTC</text>

    <!-- (3) USB-C connector on the top edge -->
    <rect class="usb" x="535" y="-6" width="92" height="50" rx="7"/>
    <rect class="usbslot" x="551" y="6" width="60" height="14" rx="7"/>
    <text class="label" x="581" y="38" font-size="12">USB-C</text>

    <!-- (7) charger, SOT-23-5, right edge aligned with USB-C -->
    <rect class="pin" x="595" y="94" width="5" height="8"/>
    <rect class="pin" x="615" y="94" width="5" height="8"/>
    <rect class="pin" x="595" y="130" width="5" height="8"/>
    <rect class="pin" x="605" y="130" width="5" height="8"/>
    <rect class="pin" x="615" y="130" width="5" height="8"/>
    <rect class="chip" x="589" y="100" width="38" height="32" rx="2"/>
    <text class="chiptxt" x="608" y="121" font-size="11">CHG</text>

    <!-- (4) battery, right edge aligned with the keyboard -->
    <rect class="bat" x="650" y="28" width="150" height="124" rx="10"/>
    <text class="label" x="725" y="96" font-size="18" font-weight="600">Battery</text>

    <!-- text on the keyboard board -->
    <text class="title" transform="rotate(-90 82 360)" x="82" y="360">Business Card</text>
    <text class="subtitle" transform="rotate(-90 122 360)" x="122" y="360">RPN Calculator with Watch</text>

    <!-- (2) keyboard: 4 x 4 cells of 143 x 77 units -->
    <rect class="grid" x="228" y="206" width="572" height="308"/>
    <path class="grid" d="M371,206 V514 M514,206 V514 M657,206 V514 M228,283 H800 M228,360 H800 M228,437 H800"/>
    <!-- legends: main one left of the button, shifted one above it -->
    <g>
      <!-- row 1 -->
      <text class="main" x="256" y="262">F</text><text class="shift" x="320" y="228">MATH</text>
      <text class="main" x="399" y="262">7</text><text class="shift" x="463" y="228">TRIG</text>
      <text class="main" x="542" y="262">8</text><text class="shift" x="606" y="228">PROG</text>
      <text class="main" x="685" y="262">9</text><text class="shift" x="749" y="228">÷</text>
      <!-- row 2 -->
      <text class="main" x="256" y="339">E</text><text class="shift" x="320" y="305">ROT↑</text>
      <text class="main" x="399" y="339">4</text><text class="shift" x="463" y="305">CONST</text>
      <text class="main" x="542" y="339">5</text><text class="shift" x="606" y="305">MEM+</text>
      <text class="main" x="685" y="339">6</text><text class="shift" x="749" y="305">×</text>
      <!-- row 3 -->
      <text class="main" x="256" y="416">±</text><text class="shift" x="320" y="382">ROT↓</text>
      <text class="main" x="399" y="416">1</text><text class="shift" x="463" y="382">RCL</text>
      <text class="main" x="542" y="416">2</text><text class="shift" x="606" y="382">STO</text>
      <text class="main" x="685" y="416">3</text><text class="shift" x="749" y="382">−</text>
      <!-- row 4 -->
      <text class="main" x="256" y="493">C</text><text class="shift" x="320" y="459">AC</text>
      <text class="main" x="399" y="493">0</text><text class="shift" x="463" y="459">LAST</text>
      <text class="main" x="542" y="493">.</text><text class="shift" x="606" y="459">X↔Y</text>
      <text class="main" x="685" y="493">↑</text><text class="shift" x="749" y="459">+</text>
    </g>
    <!-- buttons: 3 x 6 mm tact switches -->
    <g id="btn">
      <rect class="btnfrm" x="288" y="238" width="64" height="30" rx="3"/>
      <rect class="btn" x="300" y="243" width="40" height="20" rx="2"/>
    </g>
    <use href="#btn" x="143"/><use href="#btn" x="286"/><use href="#btn" x="429"/>
    <g id="btnrow"><use href="#btn"/><use href="#btn" x="143"/><use href="#btn" x="286"/><use href="#btn" x="429"/></g>
    <use href="#btnrow" y="77"/><use href="#btnrow" y="154"/><use href="#btnrow" y="231"/>

    <!-- part numbers -->
    <g id="badges">
      <circle class="badge" cx="180" cy="165" r="11"/><text class="badgetx" x="180" y="170">1</text>
      <circle class="badge" cx="210" cy="500" r="11"/><text class="badgetx" x="210" y="505">2</text>
      <circle class="badge" cx="518" cy="20" r="11"/><text class="badgetx" x="518" y="25">3</text>
      <circle class="badge" cx="725" cy="165" r="11"/><text class="badgetx" x="725" y="170">4</text>
      <circle class="badge" cx="388" cy="165" r="11"/><text class="badgetx" x="388" y="170">5</text>
      <circle class="badge" cx="476" cy="165" r="11"/><text class="badgetx" x="476" y="170">6</text>
      <circle class="badge" cx="572" cy="116" r="11"/><text class="badgetx" x="572" y="121">7</text>
    </g>
  </g>
</svg>
