<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 875 560" width="875" height="560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Tiny RPN Calculator</title>
  <style>
    .board    { stroke-width: 2; fill: #ffffff; stroke: #57606a; }
    .cap      { fill: #1f2328; }
    .cell     { fill: #eaeef2; stroke: #d18b2c; stroke-width: 10; }
    .chip     { fill: #24292f; }
    .chiptxt  { fill: #ffffff; font-size: 14px; font-weight: 600; text-anchor: middle; }
    .glass    { fill: #24292f; stroke: #57606a; stroke-width: 1.5; }
    .hole     { fill: none; stroke-width: 2; stroke: #57606a; }
    .label    { fill: #1f2328; font-size: 18px; font-weight: 600; text-anchor: middle; }
    .ledge    { fill: #57606a; }
    .line     { fill: none; stroke-width: 2; stroke: #57606a; }
    .main     { font-size: 52px; text-anchor: middle; fill: #1f2328; }
    .panel    { fill: #000000; }
    .pin      { fill: #8c959f; }
    .pixel    { fill: #ffffff; }
    .ribbon   { fill: #d18b2c; }
    .shift    { font-size: 26px; fill: #1f2328; }
    .slot     { fill: none; stroke-width: 1.5; stroke: #57606a; }
    .subtitle { font-size: 27px; text-anchor: middle; fill: #1f2328; }
    .tab      { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .title    { font-size: 46px; font-weight: 700; text-anchor: middle; fill: #1f2328; }
    .usb      { fill: #d0d7de; stroke: #57606a; stroke-width: 1.5; }
    .usbleg   { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .board    { fill: #0d1117; stroke: #8b949e; }
      .cap      { fill: #e6edf3; }
      .chip     { fill: #30363d; }
      .hole     { stroke: #8b949e; }
      .line     { stroke: #8b949e; }
      .main     { fill: #e6edf3; }
      .pin      { fill: #6e7681; }
      .shift    { fill: #e6edf3; }
      .slot     { stroke: #8b949e; }
      .subtitle { fill: #e6edf3; }
      .title    { fill: #e6edf3; }
    }
  </style>
  <defs>
    <!-- one side of a SOIC-8 -->
    <g id="soic-pins">
      <rect class="pin" x="-21" y="-4" width="4" height="8"/>
      <rect class="pin" x="-8.5" y="-4" width="4" height="8"/>
      <rect class="pin" x="4.5" y="-4" width="4" height="8"/>
      <rect class="pin" x="17" y="-4" width="4" height="8"/>
    </g>
  </defs>

  <!-- main board: 85.5 x 54 mm, 3 mm corners -->
  <rect class="board" x="0" y="0" width="855" height="540" rx="30"/>
  <circle class="hole" cx="825" cy="30" r="12.7"/>

  <!-- (1) display: glass, OLED panel with the watch screen, flexible cable -->
  <rect class="ribbon" x="320" y="58" width="56" height="78" rx="3"/>
  <rect class="glass" x="22" y="24" width="303" height="115" rx="3"/>
  <rect class="panel" x="26" y="28" width="246" height="94"/>
  <rect class="ledge" x="26" y="122" width="246" height="13"/>
  <path class="pixel" transform="translate(36 47) scale(1.75)" d="M6 2v13h1v-13zM6 16v13h1v-13zM8 2v13h1v-13zM9 15v1h5v-1zM14 2v13h1v-13zM14 16v13h1v-13zM18 8v3h3v-3zM18 20v3h3v-3zM25 1v1h5v-1zM25 15v1h5v-1zM25 29v1h5v-1zM30 2v13h1v-13zM30 16v13h1v-13zM32 2v13h1v-13zM32 16v13h1v-13zM33 1v1h5v-1zM33 29v1h5v-1zM38 2v13h1v-13zM38 16v13h1v-13zM42 8v3h3v-3zM42 20v3h3v-3zM48 2v13h1v-13zM48 16v13h1v-13zM49 1v1h5v-1zM49 29v1h5v-1zM54 2v13h1v-13zM54 16v13h1v-13zM56 2v13h1v-13zM56 16v13h1v-13zM57 1v1h5v-1zM57 29v1h5v-1zM62 2v13h1v-13zM62 16v13h1v-13zM72 1v6h1v-6zM72 11v1h10v-1zM72 17v6h2v-6zM73 1v1h3v-1zM73 6v1h3v-1zM74 19v1h6v-1zM76 1v6h1v-6zM78 1v6h1v-6zM79 1v1h4v-1zM79 6v1h4v-1zM80 17v6h2v-6zM83 11v1h10v-1zM83 17v6h2v-6zM84 1v1h2v-1zM85 17v1h6v-1zM85 20v1h6v-1zM86 1v6h1v-6zM87 1v1h2v-1zM91 17v4h2v-4zM94 11v1h10v-1zM94 19v1h10v-1zM98 1v1h1v-1zM99 1v6h1v-6zM103 1v2h1v-2zM104 1v1h3v-1zM105 11v1h10v-1zM105 17v1h8v-1zM105 22v1h8v-1zM107 1v6h1v-6zM107 19v1h6v-1zM109 6v1h1v-1zM110 5v1h1v-1zM111 4v1h1v-1zM112 3v1h1v-1zM113 2v1h1v-1zM113 17v6h2v-6zM115 1v1h4v-1zM115 4v3h1v-3zM116 4v1h3v-1zM116 6v1h4v-1zM116 17v3h2v-3zM116 22v1h8v-1zM118 17v1h8v-1zM118 19v1h6v-1zM119 1v4h1v-4zM121 1v6h1v-6zM122 1v1h4v-1zM122 3v1h3v-1zM122 6v1h3v-1zM124 19v4h2v-4zM125 3v4h1v-4z"/>

  <!-- (2) MCU, ATtiny85 in SOIC-8 5.3 mm -->
  <use href="#soic-pins" x="460" y="40"/>
  <use href="#soic-pins" x="460" y="105"/>
  <rect class="chip" x="433.5" y="46" width="53" height="53" rx="3"/>
  <text class="chiptxt" x="460" y="77">MCU</text>

  <!-- (3) RTC, DS3231M in SOIC-8 3.9 mm -->
  <use href="#soic-pins" x="515" y="40"/>
  <use href="#soic-pins" x="515" y="90"/>
  <rect class="chip" x="490.5" y="45.5" width="49" height="39" rx="3"/>
  <text class="chiptxt" x="515" y="70">RTC</text>

  <!-- (4) USB-C receptacle, its front flush with the top edge -->
  <rect class="usbleg" x="549" y="42" width="8" height="16" rx="1"/>
  <rect class="usbleg" x="643" y="42" width="8" height="16" rx="1"/>
  <rect class="usb" x="556" y="0" width="88" height="72" rx="3"/>
  <text class="label" x="600" y="60">USB-C</text>

  <!-- (5) charger in SOT-23-5, right edge aligned with USB-C -->
  <rect class="pin" x="617" y="93" width="4" height="7"/>
  <rect class="pin" x="637" y="93" width="4" height="7"/>
  <rect class="pin" x="617" y="115" width="4" height="7"/>
  <rect class="pin" x="627" y="115" width="4" height="7"/>
  <rect class="pin" x="637" y="115" width="4" height="7"/>
  <rect class="chip" x="614" y="99" width="30" height="17" rx="2"/>

  <!-- (6) battery: 16 mm coin cell in the cutout of the board -->
  <circle class="cell" cx="735" cy="102.5" r="75"/>
  <rect class="tab" x="700" y="87.5" width="130" height="30" rx="6"/>
  <text class="label" x="735" y="70">BATTERY</text>

  <!-- keyboard board over the lower part: 37 mm high, cut out around the battery -->
  <path class="board" d="M0,170 H687.5 A82.55,82.55 0 0 0 782.5,170 H855 V510 a30,30 0 0 1 -30,30 H30 a30,30 0 0 1 -30,-30 Z"/>
  <text class="title" transform="rotate(-90 121 355)" x="121" y="355" textLength="320" lengthAdjust="spacingAndGlyphs">Business Card</text>
  <text class="subtitle" transform="rotate(-90 161 355)" x="161" y="355" textLength="320" lengthAdjust="spacingAndGlyphs">RPN Calculator with Watch</text>

  <!-- (7) keyboard -->
  <path class="line" d="M190,195 H830 V515 H190 Z M350,195 V515 M510,195 V515 M670,195 V515 M190,275 H830 M190,355 H830 M190,435 H830"/>
  <path class="slot" d="M253,225 H330 L340,235 V255 L330,265 H253 L243,255 V235 Z"/><rect class="cap" x="272.5" y="236" width="38" height="18" rx="3"/>
  <text class="main" x="216.5" y="253">F</text><text class="shift" x="243" y="220">MATH</text>
  <path class="slot" d="M413,225 H490 L500,235 V255 L490,265 H413 L403,255 V235 Z"/><rect class="cap" x="432.5" y="236" width="38" height="18" rx="3"/>
  <text class="main" x="376.5" y="253">7</text><text class="shift" x="403" y="220">TRIG</text>
  <path class="slot" d="M573,225 H650 L660,235 V255 L650,265 H573 L563,255 V235 Z"/><rect class="cap" x="592.5" y="236" width="38" height="18" rx="3"/>
  <text class="main" x="536.5" y="253">8</text><text class="shift" x="563" y="220">PROG</text>
  <path class="slot" d="M733,225 H810 L820,235 V255 L810,265 H733 L723,255 V235 Z"/><rect class="cap" x="752.5" y="236" width="38" height="18" rx="3"/>
  <text class="main" x="696.5" y="253">9</text><text class="shift" x="723" y="220">÷</text>
  <path class="slot" d="M253,305 H330 L340,315 V335 L330,345 H253 L243,335 V315 Z"/><rect class="cap" x="272.5" y="316" width="38" height="18" rx="3"/>
  <text class="main" x="216.5" y="333">E</text><text class="shift" x="243" y="300">ROT↑</text>
  <path class="slot" d="M413,305 H490 L500,315 V335 L490,345 H413 L403,335 V315 Z"/><rect class="cap" x="432.5" y="316" width="38" height="18" rx="3"/>
  <text class="main" x="376.5" y="333">4</text><text class="shift" x="403" y="300">CONST</text>
  <path class="slot" d="M573,305 H650 L660,315 V335 L650,345 H573 L563,335 V315 Z"/><rect class="cap" x="592.5" y="316" width="38" height="18" rx="3"/>
  <text class="main" x="536.5" y="333">5</text><text class="shift" x="563" y="300">MEM+</text>
  <path class="slot" d="M733,305 H810 L820,315 V335 L810,345 H733 L723,335 V315 Z"/><rect class="cap" x="752.5" y="316" width="38" height="18" rx="3"/>
  <text class="main" x="696.5" y="333">6</text><text class="shift" x="723" y="300">×</text>
  <path class="slot" d="M253,385 H330 L340,395 V415 L330,425 H253 L243,415 V395 Z"/><rect class="cap" x="272.5" y="396" width="38" height="18" rx="3"/>
  <text class="main" x="216.5" y="413">±</text><text class="shift" x="243" y="380">ROT↓</text>
  <path class="slot" d="M413,385 H490 L500,395 V415 L490,425 H413 L403,415 V395 Z"/><rect class="cap" x="432.5" y="396" width="38" height="18" rx="3"/>
  <text class="main" x="376.5" y="413">1</text><text class="shift" x="403" y="380">RCL</text>
  <path class="slot" d="M573,385 H650 L660,395 V415 L650,425 H573 L563,415 V395 Z"/><rect class="cap" x="592.5" y="396" width="38" height="18" rx="3"/>
  <text class="main" x="536.5" y="413">2</text><text class="shift" x="563" y="380">STO</text>
  <path class="slot" d="M733,385 H810 L820,395 V415 L810,425 H733 L723,415 V395 Z"/><rect class="cap" x="752.5" y="396" width="38" height="18" rx="3"/>
  <text class="main" x="696.5" y="413">3</text><text class="shift" x="723" y="380">−</text>
  <path class="slot" d="M253,465 H330 L340,475 V495 L330,505 H253 L243,495 V475 Z"/><rect class="cap" x="272.5" y="476" width="38" height="18" rx="3"/>
  <text class="main" x="216.5" y="493">C</text><text class="shift" x="243" y="460">AC</text>
  <path class="slot" d="M413,465 H490 L500,475 V495 L490,505 H413 L403,495 V475 Z"/><rect class="cap" x="432.5" y="476" width="38" height="18" rx="3"/>
  <text class="main" x="376.5" y="493">0</text><text class="shift" x="403" y="460">LAST</text>
  <path class="slot" d="M573,465 H650 L660,475 V495 L650,505 H573 L563,495 V475 Z"/><rect class="cap" x="592.5" y="476" width="38" height="18" rx="3"/>
  <text class="main" x="536.5" y="493">.</text><text class="shift" x="563" y="460">X↔Y</text>
  <path class="slot" d="M733,465 H810 L820,475 V495 L810,505 H733 L723,495 V475 Z"/><rect class="cap" x="752.5" y="476" width="38" height="18" rx="3"/>
  <text class="main" x="696.5" y="493">↑</text><text class="shift" x="723" y="460">+</text>

</svg>
