<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 185 660 340" width="660" height="340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Keyboard of the Tiny RPN Calculator</title>
  <style>
    .cap      { fill: #1f2328; }
    .line     { fill: none; stroke-width: 2; stroke: #57606a; }
