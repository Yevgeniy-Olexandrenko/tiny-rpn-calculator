    .shift    { font-size: 26px; fill: #1f2328; }
    .slot     { fill: none; stroke-width: 1.5; stroke: #57606a; }
    @media (prefers-color-scheme: dark) {
      .cap      { fill: #e6edf3; }
      .line     { stroke: #8b949e; }
      .main     { fill: #e6edf3; }
      .shift    { fill: #e6edf3; }
      .slot     { stroke: #8b949e; }
    }
  </style>
